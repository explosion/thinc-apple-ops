name: Build

on:
  push:
    tags:
      # ytf did they invent their own syntax that's almost regex?
      # ** matches 'zero or more of any character'
      - 'release-v[0-9]+.[0-9]+.[0-9]+**'
      - 'prerelease-v[0-9]+.[0-9]+.[0-9]+**'

permissions: {}

jobs:
  build_wheels:
    uses: explosion/gha-cibuildwheel/.github/workflows/cibuildwheel.yml@2ade48ac7d4fed55e9f24f73eddd8f280722a2f8 # main
    permissions:
      contents: write
      actions: read
    with:
      pure-python: false
      wheel-name-pattern: "thinc_apple_ops-*.whl"
      # Apple's Accelerate framework is only available on macOS
      os-matrix: '["macos-15-intel", "macos-latest"]'
    secrets:
      gh-token: ${{ secrets.GITHUB_TOKEN }}
